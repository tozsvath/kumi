<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Days since — Jan 5, 09:00</title>
  <style>
    :root{
      --bg1:#0f172a; --bg2:#0b1220; --accent:#60a5fa; --muted:#94a3b8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto;
    }
    html,body{height:100%;}
    body{
      margin:0;
      background: linear-gradient(135deg,var(--bg1),var(--bg2));
      color:#e6eef8;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .wrap{max-width:1100px;width:100%;text-align:center}
    h1{font-size:clamp(20px,3.6vw,36px);margin:0 0 24px}

    .unit{
      background: rgba(255,255,255,0.03);
      border-radius:18px;
      padding:28px 36px;
      display:inline-flex;
      flex-direction:column;
      align-items:center;
      box-shadow:0 6px 30px rgba(2,6,23,0.6);
    }
    .number{
      font-weight:700;
      font-size:clamp(48px,10vw,120px);
      line-height:1;
    }
    .label{
      margin-top:12px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:0.2em;
      font-size:14px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="unit">
      <div id="days" class="number">0</div>
      <div class="label">Napja dolgozik Motya</div>
    </div>

  </main>

  <script>
    // Start date: Jan 5, 2026, 09:00
    const startDate = new Date(2026, 0, 4, 16, 0, 0);
    const daysEl = document.getElementById('days');

    function updateDays() {
      const now = new Date();
      const diffMs = Math.max(0, now - startDate);
      const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      daysEl.textContent = days;
    }

    updateDays();
    setInterval(updateDays, 60 * 1000); // update every minute
  </script>
</body>
</html>
